<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F07BA3">
<meta name="description" content="Học tiếng Trung HSK 1–3 cho người Việt: nghe, đọc, nói, viết.">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one mobile column; home = lesson list; lesson = vocab + 4 skills; exercise = progress, task, fixed check bar */
:root{
  --bg:#FFFAFC;--surface:#FFFFFF;--surface-2:#FFF0F5;--fg:#5A3341;--muted:#A07C89;--line:#FBE1EA;
  --accent:#F07BA3;--accent-ink:#FFFFFF;--accent-deep:#DB6189;--accent-soft:#FFEDF3;
  --ok:#3F9E6E;--ok-deep:#2F7C55;--ok-soft:#E1F4E9;
  --bad:#D1453B;--bad-deep:#A3322A;--bad-soft:#FDE3E1;
  --t1:#C0392B;--t2:#B26E12;--t3:#2E7D4F;--t4:#2A63A8;--t0:#8A7F84;
  color-scheme:light;
  --font-body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-han:"Noto Serif SC","Songti SC","SimSun",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:16px 150px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.han{font-family:var(--font-han);font-weight:600}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.seal{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:24px;flex:none}
.brand b{font-size:19px;display:block;line-height:1.25;text-wrap:balance}
.brand small{color:var(--muted);font-size:13px}
.back{background:var(--surface);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;flex:none;font-size:20px;display:grid;place-items:center}
.lessons{display:flex;flex-direction:column;gap:12px}
.lesson{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:14px 16px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.lesson:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lesson .num{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:28px;flex:none}
.lesson .txt{min-width:0}
.lesson b{display:block;font-size:17px}
.lesson .txt>span{font-size:14px;color:var(--muted)}
.lesson .txt{color:var(--fg)}
.lvh{margin:14px 6px 0;display:flex;flex-direction:column}
.lvh:first-child{margin-top:0}
.lvh b{font-size:15px;color:var(--accent-deep)}
.lvh span{font-size:13px;color:var(--muted)}
.tile small:empty{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.tab{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 var(--line)}
.tab b{font-size:16px}
.tab span{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-deep)}
.tab.on span{color:var(--accent-ink)}
.pyh{display:none!important}
body.showpy .pyh{display:block!important}
.btn2.pyt{padding:6px 12px;font-size:14px;flex:none}
.btn2.pyt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.words{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 16px;margin-bottom:22px}
.words p{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wl{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.w{display:flex;flex-direction:column;align-items:flex-start;background:var(--surface-2);border:0;border-radius:14px;padding:8px 10px;text-align:left}
.w .han{font-size:22px;line-height:1.3}
.w span{font-size:13px}
.w small{font-size:12px;color:var(--muted)}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skill{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:16px 14px;box-shadow:0 4px 0 var(--line);text-align:left;display:flex;flex-direction:column;gap:6px}
.skill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.skill .ic{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:24px}
.skill b{font-size:17px}
.skill span{font-size:13px;color:var(--muted)}
.skill.all{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--accent);border-color:var(--accent);box-shadow:0 4px 0 var(--accent-deep);color:var(--accent-ink)}
.skill.all .ic{background:var(--accent-ink);color:var(--accent)}
.skill.all span{color:var(--accent-ink);opacity:.9}
.warn{margin-top:16px;font-size:14px;color:var(--bad);background:var(--bad-soft);border-radius:14px;padding:12px 14px}

.lbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{background:none;border:0;font-size:28px;line-height:1;color:var(--muted);padding:4px 8px}
.prog{flex:1;height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.kind{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep);font-weight:700;margin:0 0 4px}
.q{font-size:20px;font-weight:700;margin:0 0 16px;text-wrap:balance}
.card{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.big{font-size:72px;line-height:1.15}
.mid{font-size:44px;line-height:1.2}
.sm{font-size:32px;line-height:1.3}
.py{font-size:21px;font-weight:600}
.mean{font-size:17px;color:var(--muted)}
.note{font-size:14px;background:var(--surface-2);border-radius:14px;padding:8px 12px;margin-top:6px}
.audio{display:flex;gap:12px;justify-content:center;align-items:center;margin:4px 0}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);display:grid;place-items:center}
.play.slow{font-size:14px;font-weight:700;background:var(--surface);border:2px solid var(--accent);color:var(--accent-deep);box-shadow:0 4px 0 var(--line)}
.play:active{transform:translateY(3px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 3px 0 var(--line);font-size:17px;font-weight:600;min-height:58px;text-align:center}
.opt .han{display:block;font-size:32px;line-height:1.25}
.opt small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{visibility:hidden}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{display:flex;gap:10px;align-items:flex-end}
.bub.me{flex-direction:row-reverse}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:18px;flex:none}
.say{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 14px;min-width:0}
.say .han{font-size:24px}
.say small{display:block;color:var(--muted);font-size:13px}
.bub.me .say{border-style:dashed;color:var(--muted)}
.answer{min-height:70px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin:12px 0 18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 12px;box-shadow:0 3px 0 var(--line);text-align:center;min-width:56px}
.tile .han{font-size:24px;display:block;line-height:1.3}
.tile small{font-size:12px;color:var(--muted)}
.tile.used{opacity:.25;pointer-events:none}
.parts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.part{background:var(--surface-2);border-radius:18px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;min-width:72px}
.part .han{font-size:32px;line-height:1.2;color:var(--accent-deep)}
.part b{font-size:14px}
.part small{font-size:12px;color:var(--muted)}
.plus{font-size:22px;color:var(--muted);font-weight:700}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 5px 0 var(--accent-deep)}
@keyframes pulse{50%{transform:scale(1.06)}}
.mic.rec{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep);color:#fff;animation:pulse 1.2s ease-in-out infinite}
.mic[aria-disabled="true"]{background:var(--surface-2);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:not-allowed;animation:none}
.recbadge{display:flex;align-items:center;gap:8px;color:var(--bad);font-weight:700;font-size:15px;background:var(--bad-soft);border-radius:999px;padding:6px 14px}
.recbadge.chk{color:var(--accent-deep);background:var(--accent-soft)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.bars{display:inline-flex;align-items:center;gap:2px;height:16px}
.bars i{width:3px;height:6px;background:var(--bad);border-radius:2px;animation:eq .8s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{50%{height:16px}}
.spin{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent-deep);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vlabel{font-size:15px;text-align:center}
.vin{width:100%;max-width:360px;height:54px;border:2px solid var(--line);border-radius:999px;padding:0 20px;font-size:20px;text-align:center;background:var(--surface);color:var(--fg);font-family:var(--font-han),var(--font-body)}
.vin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.vin::placeholder{color:var(--muted);font-family:var(--font-body);font-size:16px}
.how{max-width:360px;font-size:14px;color:var(--muted)}
.how summary{cursor:pointer;text-align:center;font-weight:600;color:var(--accent-deep)}
.how p{margin:8px 0 0}
.heard{font-size:15px;color:var(--muted);text-align:center;min-height:24px}
.heard .han{color:var(--fg);font-size:20px}
.wbox{position:relative;width:min(290px,100%);aspect-ratio:1;margin:0 auto;border:2px solid var(--line);border-radius:22px;background:var(--surface);max-width:100%}
.wbox svg,.wbox canvas{position:absolute;inset:0;width:100%;height:100%}
.wbox canvas{touch-action:none}
.wbox.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wstep{text-align:center;font-size:15px;color:var(--muted);min-height:24px;margin-top:10px}
.wtools{display:flex;gap:10px;justify-content:center;margin-top:10px}
.btn2{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;box-shadow:0 3px 0 var(--line)}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot.good{background:var(--ok-soft);border-color:transparent}
.foot.wrong{background:var(--bad-soft);border-color:transparent}
.foot-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb{font-weight:700;font-size:17px}
.foot.good .fb{color:var(--ok)}
.foot.wrong .fb{color:var(--bad)}
.fb small{display:block;font-weight:500;font-size:15px;color:var(--fg)}
.row{display:flex;gap:10px}
.cta{flex:1;border:0;border-radius:999px;padding:14px;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.cta:active{transform:translateY(3px)}
.cta[aria-disabled="true"]{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.foot.good .cta{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep);color:#fff}
.foot.wrong .cta{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep);color:#fff}
.foot .cta[aria-disabled="true"]{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.skip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:12px 14px;font-weight:700;color:var(--muted)}
.end{text-align:center;padding-top:30px}
.end .han{font-size:80px;color:var(--accent);line-height:1.1}
.end h2{font-size:24px;margin:8px 0}
.end p{color:var(--muted);margin:0}
.miss{margin:20px auto 0;max-width:340px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 16px}
.miss b{font-size:14px}
.miss li{margin:4px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.inst{max-width:560px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.inst-in{display:flex;align-items:center;gap:12px;background:#FFFFFF;border:2px solid #F07BA3;border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 #FBE1EA;font-family:"Quicksand",system-ui,sans-serif;color:#5A3341}
.inst-ic{width:44px;height:44px;flex:none;border-radius:12px;background:#F07BA3;color:#fff;display:grid;place-items:center;font-size:24px;font-family:"Noto Serif SC",serif;font-weight:600}
.inst-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.inst-tx b{font-size:15px}
.inst-tx span{font-size:13px;color:#A07C89;line-height:1.45}
.inst-tx svg{vertical-align:-3px;color:#2A63A8}
.inst-btn{flex:none;border:0;border-radius:999px;background:#F07BA3;color:#fff;font:700 15px "Quicksand",system-ui,sans-serif;padding:10px 16px;box-shadow:0 3px 0 #DB6189;cursor:pointer}
.inst-x{flex:none;background:none;border:0;font-size:22px;line-height:1;color:#A07C89;padding:4px;cursor:pointer}
</style>
</head>

<div class="inst" id="inst" hidden><div class="inst-in"><span class="inst-ic">汉</span><div class="inst-tx"><b>Cài Hán Ngữ lên màn hình chính</b><span id="inst-msg">Mở như app thật, học cả khi không có mạng.</span></div><button class="inst-btn" id="inst-btn" type="button" hidden>Cài đặt</button><button class="inst-x" id="inst-x" type="button" aria-label="Ẩn hướng dẫn cài đặt">×</button></div></div>
<div class="app" id="app"></div>
<div class="foot" id="foot" hidden><div class="foot-in"><div class="fb" id="fb" hidden></div><div class="row"><button class="skip" id="skip" type="button" hidden>Bỏ qua</button><button class="cta" id="cta" type="button">KIỂM TRA</button></div></div></div>

var W={},TILEPY={};
var PUNCT=/[，。！？、,.!?\s]/g;
function key(k){return k.replace(PUNCT,'');}
function getW(k){return W[k]||W[key(k)];}
var seenRad=[],seenWrite=[];
function autoRadQ(L){var q=[],pool=seenRad.slice();
  L.rad.forEach(function(c,i){var ps=RAD[c].parts;if(ps.length<2)return;var p=ps[0];
    if(i%2===0){var oth=shuffle(pool.filter(function(x){return x!==c&&RAD[x]&&!RAD[x].parts.some(function(pp){return pp[0]===p[0];});})).slice(0,3);if(oth.length===3)q.push(['w',p[0],p[2],c,[c].concat(oth)]);}
    else{var ms=[];Object.keys(RAD).forEach(function(k){RAD[k].parts.forEach(function(pp){if(pp[2]!==p[2]&&ms.indexOf(pp[2])<0&&pp[2].indexOf('gợi âm')<0)ms.push(pp[2]);});});q.push(['m',c,p[0],p[2],[p[2]].concat(shuffle(ms).slice(0,3))]);}
  });return q;}
LESSONS.forEach(function(L){
  L.lv=L.lv||1;L.hsk=L.hsk||1;
  L.words.concat(L.sents).forEach(function(e){var o={p:e[1],m:e[2],n:e[3]};if(!W[e[0]])W[e[0]]=o;if(!W[key(e[0])])W[key(e[0])]=o;
    var ch=hanOnly(e[0]),sy=e[1].split(/[\s,，]+/).map(function(x){return x.replace(/[^a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g,'');}).filter(Boolean);
    if(ch.length===sy.length)ch.forEach(function(c,i){if(!TILEPY[c])TILEPY[c]=sy[i].toLowerCase();});});
  L.chars=[];L.words.concat(L.sents).forEach(function(e){hanOnly(e[0]).forEach(function(c){if(L.chars.indexOf(c)<0)L.chars.push(c);});});
  if(!L.tones){var tt=[];L.words.forEach(function(e){var ch=hanOnly(e[0]),sy=e[1].split(' ');if(ch.length===sy.length)ch.forEach(function(c,i){if(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/.test(sy[i])&&!tt.some(function(x){return x[0]===c;}))tt.push([c,sy[i].toLowerCase()]);});});L.tones=tt.slice(0,10);}
  L.tones.forEach(function(t){if(!TILEPY[t[0]])TILEPY[t[0]]=t[1];});
  if(!L.hear)L.hear=L.words.slice(0,6).map(function(e){return e[0];}).concat(L.sents.slice(0,2).map(function(e){return e[0];}));
  if(!L.taps)L.taps=[L.sents[0][0],L.sents[1][0]].concat(L.words.filter(function(e){return hanOnly(e[0]).length>=2;}).slice(0,1).map(function(e){return e[0];}));
  if(!L.rad)L.rad=L.chars.filter(function(c){return RAD[c]&&seenRad.indexOf(c)<0;}).slice(0,6);
  L.rad.forEach(function(c){if(seenRad.indexOf(c)<0)seenRad.push(c);});
  if(!L.write)L.write=L.chars.filter(function(c){return STROKES[c]&&seenWrite.indexOf(c)<0;}).slice(0,2);
  L.write.forEach(function(c){seenWrite.push(c);});
  if(!L.radQ)L.radQ=autoRadQ(L);
  if(!L.pick)L.pick=L.words.map(function(e){return e[0];});
});

/* ================= TIỆN ÍCH ================= */
function hanOnly(t){return (t||'').match(/[一-鿿]/g)||[];}
function lcs(a,b){var d=[];for(var i=0;i<=a.length;i++){d[i]=[];for(var j=0;j<=b.length;j++){d[i][j]=(i&&j)?(a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1])):0;}}return d[a.length][b.length];}
function sylls(t){return (t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/[^a-z]+/g,' ').trim().split(' ').filter(Boolean);}
function lev(a,b){var d=[];for(var i=0;i<=a.length;i++){d[i]=[i];for(var j=1;j<=b.length;j++)d[i][j]=i?Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j;}return d[a.length][b.length];}
function fuzzyLcs(a,b){var d=[];for(var i=0;i<=a.length;i++){d[i]=[];for(var j=0;j<=b.length;j++){d[i][j]=(i&&j)?((a[i-1]===b[j-1]||(a[i-1].length>2&&lev(a[i-1],b[j-1])<=1))?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1])):0;}}return d[a.length][b.length];}
function numHan(t){var d='零一二三四五六七八九';return (t||'').replace(/\d+/g,function(s){var n=+s;if(n<=10)return n===10?'十':d[n];if(n<20)return '十'+(n%10?d[n%10]:'');if(n<100)return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');return s;});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function bare(p){return p.normalize('NFD').replace(/[̀-ͯ]/g,'');}
var TM={'ā':1,'ē':1,'ī':1,'ō':1,'ū':1,'ǖ':1,'á':2,'é':2,'í':2,'ó':2,'ú':2,'ǘ':2,'ǎ':3,'ě':3,'ǐ':3,'ǒ':3,'ǔ':3,'ǚ':3,'à':4,'è':4,'ì':4,'ò':4,'ù':4,'ǜ':4};
var TV={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function toneOf(s){for(var i=0;i<s.length;i++){var c=s[i].toLowerCase();if(TM[c])return TM[c];}return 0;}
function colorPy(p){return p.split(' ').map(function(s){return '<span class="t'+toneOf(s)+'">'+s+'</span>';}).join(' ');}
function retone(syl,t){for(var v in TV){var str=TV[v];for(var k=0;k<4;k++){var i=syl.indexOf(str[k]);if(i>=0)return syl.slice(0,i)+TV[v][t-1]+syl.slice(i+1);}}return syl;}
function pyVariants(p){var sy=p.split(' '),out=[],tries=0;
  while(out.length<3&&tries<80){tries++;var c=sy.slice(),idx=sy.map(function(s,i){return toneOf(s)?i:-1;}).filter(function(i){return i>=0;});if(!idx.length)break;
    var i=idx[Math.floor(Math.random()*idx.length)],t=toneOf(c[i]),nt=1+Math.floor(Math.random()*4);if(nt===t)continue;c[i]=retone(c[i],nt);var v=c.join(' ');if(v!==p&&out.indexOf(v)<0)out.push(v);}
  return out;}
function others(k,list,n){return shuffle(list.filter(function(x){return x!==k;})).slice(0,n||3);}
function size(t){var n=hanOnly(t).length;return n<=2?'big':n<=4?'mid':'sm';}
function memo(word){return hanOnly(word).filter(function(c,i,a){return RAD[c]&&a.indexOf(c)===i;}).map(function(c){return c+' = '+RAD[c].parts.map(function(p){return p[0]+' '+p[2];}).join(' + ');}).join('<br>');}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}

function tpy(w){return TILEPY[w]||'';}
function pyc(){return '';}
function pyOfC(c){return RAD[c]?RAD[c].py:(getW(c)?getW(c).p:(TILEPY[c]||''));}
function bankFor(ans,L){var extra=shuffle(L.chars.filter(function(c){return ans.indexOf(c)<0;})).slice(0,L.lv+1);return ans.concat(extra);}
function build(k,L){var a=buildNew(k,L);return L.n>1?a.concat(review(k,L)):a;}
function review(k,L){
  var prev=LESSONS.filter(function(x){return x.n<L.n;}),old=[],sp=[],bl=[];
  prev.forEach(function(x){x.words.forEach(function(e){if(old.indexOf(e[0])<0)old.push(e[0]);});sp=sp.concat(x.speak);bl=bl.concat(x.builds);});
  var n=Math.min(1+Math.ceil((L.n-1)/3),4);
  if(k==='nghe')return shuffle(old).slice(0,n).map(function(w){return {t:'hearWord',h:w,pool:old,old:true};});
  if(k==='doc')return shuffle(old).slice(0,n).map(function(w){return {t:'pick',k:w,pool:old,old:true};});
  if(k==='noi')return shuffle(sp).slice(0,Math.min(2,n)).map(function(h){return {t:'speak',h:h,old:true};});
  if(k==='viet')return shuffle(bl).slice(0,Math.min(2,n)).map(function(b){var a=hanOnly(b[1]);return {t:'build',vn:b[0],ans:a,bank:bankFor(a,L),old:true};});
  return [];}
function buildNew(k,L){
  var wordKeys=L.words.map(function(e){return e[0];}),sentKeys=L.sents.map(function(e){return e[0];});
  if(k==='nghe'){
    var poolOf=function(h){return hanOnly(h).length>3||sentKeys.indexOf(h)>=0?sentKeys:wordKeys;},hs=shuffle(L.hear.concat(shuffle(wordKeys.filter(function(w){return L.hear.indexOf(w)<0;})).slice(0,Math.min(L.lv*2,6))));
    return hs.map(function(h){return {t:'hearWord',h:h,pool:poolOf(h)};})
      .concat(shuffle(L.tones).slice(0,3).map(function(t){return {t:'tone',h:t[0],p:t[1],ans:toneOf(t[1])};}))
      .concat(shuffle(L.hear).slice(0,2).map(function(h){return {t:'hearMean',h:h,pool:poolOf(h)};}))
      .concat(L.taps.map(function(h){var a=hanOnly(h);return {t:'tap',h:h,ans:a,bank:bankFor(a,L)};}));}
  if(k==='doc'){
    return L.rad.map(function(c){return {t:'rad',c:c};})
      .concat(shuffle(L.radQ.map(function(q){return q[0]==='w'?{t:'radWhich',r:q[1],mean:q[2],ans:q[3],opts:q[4]}:{t:'radMean',c:q[1],r:q[2],ans:q[3],opts:q[4]};})))
      .concat(shuffle(wordKeys).slice(0,Math.min(3+L.lv,6)).map(function(w){return {t:'pick',k:w,pool:wordKeys};}))
      .concat(shuffle(wordKeys.filter(function(w){return toneOf(getW(w).p);})).slice(0,Math.min(1+L.lv,4)).map(function(w){return {t:'pinyin',k:w};}))
      .concat([{t:'match',keys:shuffle(wordKeys).slice(0,L.lv>1?5:4)}])
      .concat(L.chats.map(function(c){return {t:'chat',line:c[0],ans:c[1],opts:c[2]};}));}
  if(k==='noi')return L.speak.map(function(h){return {t:'speak',h:h};});
  if(k==='viet'){
    return L.write.map(function(c){return {t:'write',h:c,guide:true};}).concat(L.write.map(function(c){return {t:'write',h:c,guide:false};}))
      .concat(L.builds.map(function(b){var a=hanOnly(b[1]);return {t:'build',vn:b[0],ans:a,bank:bankFor(a,L)};}));}
}
function start(k){
  var L=CUR,q,name;
  if(k==='all'){name='Ôn tất cả Bài '+L.n;q=[];['nghe','doc','noi','viet'].forEach(function(s){q=q.concat(shuffle(build(s,L).filter(function(x){return x.t!=='rad';})).slice(0,4));});q=shuffle(q);}

     if(o.dataset.side==='l')say(o.dataset.k);
     if(!pick||pick.dataset.side===o.dataset.side){app.querySelectorAll('.match .sel').forEach(function(x){x.classList.remove('sel');});pick=o;o.classList.add('sel');return;}
     if(pick.dataset.k===o.dataset.k){[pick,o].forEach(function(x){x.classList.remove('sel');x.classList.add('ok');setTimeout(function(){x.classList.add('gone');},250);});left--;pick=null;
       if(!left){S.done=true;feedback('good',miss?'Xong rồi!':'Hoàn hảo!','');setCta('TIẾP TỤC',true,next);}}
     else{miss=true;var a=pick;[a,o].forEach(function(x){x.classList.add('no');});setTimeout(function(){[a,o].forEach(function(x){x.classList.remove('no','sel');});},450);pick=null;}
   };});},
 build:function(s){tileLogic(s,s.ans.join('')+' · '+pyOf(s.ans),true);},
 speak:function(s){setTimeout(function(){say(s.h);},250);
   var mic=document.getElementById('mic');
   if(!mic){
     var vin=document.getElementById('vin'),vh=document.getElementById('heard'),vt=hanOnly(s.h),vpy=sylls(getW(s.h).p),vth=s.h.indexOf('，')>=0?0.5:(vt.length>=5?0.6:0.75),vtries=0;
     function vscore(text){text=numHan(text);var h=hanOnly(text),best=0;
       if(h.length)[vt].concat((ALT[key(s.h)]||[]).map(hanOnly)).forEach(function(t){best=Math.max(best,lcs(t,h)/t.length);});
       var l=sylls(text);if(l.length&&!h.length)best=Math.max(best,fuzzyLcs(vpy,l)/vpy.length);return best;}
     function vcheck(){var text=vin.value.trim();if(!text||S.done)return;vtries++;vin.blur();
       vh.innerHTML='Máy nghe được: <span class="han">'+esc(text)+'</span>';
       if(vscore(text)>=vth){S.done=true;vin.disabled=true;skip.hidden=true;feedback('good','Phát âm chuẩn!','Máy nghe đúng câu mẫu.');setCta('TIẾP TỤC',true,next);}
       else{vin.value='';feedback('wrong','Chưa chuẩn, thử lại nhé',vtries>=3?'Nghe chậm rồi đọc lại, hoặc bấm “Không nói được lúc này”.':'Bấm vào ô, chạm micro trên bàn phím và đọc lại.');setCta('KIỂM TRA',false,vcheck);}}
     setCta('KIỂM TRA',false,vcheck);
     vin.oninput=function(){if(S.done)return;feedback('');cta.setAttribute('aria-disabled',vin.value.trim()?'false':'true');};
     vin.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();vcheck();}};
     skip.textContent='Không nói được lúc này';skip.hidden=false;skip.onclick=function(){S.done=true;skip.hidden=true;vin.disabled=true;feedback('good','Đã bỏ qua','Nhớ tự đọc to câu này vài lần nhé.');setCta('TIẾP TỤC',true,next);};
     return;}
   var heard=document.getElementById('heard'),got='',part='',st='idle',safety=null,tries=0,useLang=true;
   var target=hanOnly(s.h),targetPy=sylls(getW(s.h).p),th=s.h.indexOf('，')>=0?0.5:(target.length>=5?0.6:0.75);
   mic.insertAdjacentHTML('afterend','<div class="recbadge" id="rec" hidden><span class="rdot"></span>Đang ghi âm<span class="bars"><i></i><i></i><i></i><i></i></span></div><div class="recbadge chk" id="chk" hidden><span class="spin"></span>Đang kiểm tra…</div>');
   var rec=document.getElementById('rec'),chk=document.getElementById('chk');
   function setState(n){st=n;
     mic.classList.toggle('rec',n==='rec'||n==='starting');
     var locked=n==='checking'||n==='done';mic.setAttribute('aria-disabled',locked?'true':'false');
     rec.hidden=!(n==='rec'||n==='starting');chk.hidden=n!=='checking';
     if(n==='idle')setCta('KIỂM TRA',false,function(){});
     if(n==='rec'||n==='starting')setCta('KIỂM TRA',true,check);
     if(n==='checking')setCta('ĐANG KIỂM TRA…',false,function(){});}
   setState('idle');
   skip.textContent='Không nói được lúc này';skip.hidden=false;skip.onclick=function(){if(st==='checking')return;S.cleanup&&S.cleanup();S.done=true;skip.hidden=true;setState('done');feedback('good','Đã bỏ qua','Nhớ tự đọc to câu này vài lần nhé.');setCta('TIẾP TỤC',true,next);};
   function score(text){
     text=numHan(text);var h=hanOnly(text),best=0;
     if(h.length)[target].concat((ALT[key(s.h)]||[]).map(hanOnly)).forEach(function(t){best=Math.max(best,lcs(t,h)/t.length);});
     var l=sylls(text);if(l.length&&!h.length)best=Math.max(best,fuzzyLcs(targetPy,l)/targetPy.length);
     return best;}
   function evaluate(){
     if(st!=='checking')return;
     var text=(got+' '+part).trim();tries++;
     if(!text){setState('idle');heard.textContent='Máy chưa nghe thấy gì. Bấm micro, đọc to và rõ rồi bấm Kiểm tra.';return;}
     heard.innerHTML='Máy nghe được: <span class="han">'+esc(text)+'</span>';
     if(score(text)>=th){setState('done');skip.hidden=true;S.done=true;feedback('good','Phát âm chuẩn!','Máy nghe đúng câu mẫu.');setCta('TIẾP TỤC',true,next);}
     else{setState('idle');feedback('wrong','Chưa chuẩn, thử lại nhé',tries>=3?'Nghe chậm rồi đọc lại, hoặc bấm “Không nói được lúc này”.':'Chú ý thanh điệu theo màu, rồi bấm micro đọc lại.');}}
   var MSG={not_granted:'Bạn chưa cho phép dùng micro. Bấm “Không nói được lúc này” để đi tiếp.',dismissed:'Bấm micro lần nữa và chọn Cho phép.',rate_limited:'Máy đang bận, đợi vài giây rồi bấm micro lại.',upstream_error:'Micro bị lỗi, bấm micro thử lại nhé.'};
   function failMsg(c){if(c==='unavailable'){if(useLang){useLang=false;return 'Bấm micro lần nữa để thử lại.';}return 'Máy này chưa nhận dạng giọng nói được. Bấm “Không nói được lúc này” để đi tiếp.';}return MSG[c]||'Chưa ghi âm được, bấm micro thử lại.';}
   var u1=DICT.onPartial(function(e){if(st!=='rec'&&st!=='starting'&&st!=='checking')return;part=e.text||'';if(e.text&&st!=='checking')heard.innerHTML='Đang nghe: <span class="han">'+esc(e.text)+'</span>';});
   var u2=DICT.onFinal(function(e){if(st==='rec'||st==='starting'||st==='checking'){got+=e.text;part='';}});
   var u3=DICT.onState(function(e){
     if(e.state==='listening'&&st==='starting'){setState('rec');heard.textContent='Đọc to câu trên, xong thì bấm Kiểm tra';}
     if(e.state==='idle'&&(st==='rec'||st==='starting')){
       var r=e.reason;
       if(r==='viewer_stopped'||r==='time_limit'||r==='hidden'){check();return;}
       if(r&&r!=='stopped'){clearTimeout(safety);setState('idle');heard.textContent=failMsg(r);}}});
   function check(){
     if(st!=='rec'&&st!=='starting')return;
     clearTimeout(safety);setState('checking');feedback('');
     var fin=false;function go(){if(fin)return;fin=true;evaluate();}
     DICT.stop().then(function(){setTimeout(go,400);},go);setTimeout(go,3000);}
   S.cleanup=function(){u1();u2();u3();clearTimeout(safety);if(st==='rec'||st==='starting'){st='done';DICT.stop().catch(function(){});}};
   mic.onclick=function(){
     if(st==='checking'||st==='done')return;
     if(st==='rec'||st==='starting'){check();return;}
     got='';part='';feedback('');
     var p=useLang?DICT.start({language:'zh'}):DICT.start();
     try{speechSynthesis.cancel();}catch(x){}
     setState('starting');heard.textContent='Đang mở micro…';
     p.then(function(){if(st==='starting'){setState('rec');heard.textContent='Đọc to câu trên, xong thì bấm Kiểm tra';}clearTimeout(safety);safety=setTimeout(check,20000);})
      .catch(function(err){if(st==='done'||st==='checking')return;clearTimeout(safety);setState('idle');heard.textContent=failMsg(err&&err.code);});
   };},
 write:function(s){
   var st=STROKES[s.h],cv=document.getElementById('cv'),box=document.getElementById('wbox'),ctx=cv.getContext('2d'),r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
   var msg=document.getElementById('wstep'),doneG=document.getElementById('done'),hintG=document.getElementById('hint'),dot=document.getElementById('dot');
   cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(8,r.width/28);
   ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()||'#888';
   var NS='http://www.w3.org/2000/svg',k=0,misses=0,pts=[],down=false;
   var meas=st.map(function(x){var p=document.createElementNS(NS,'path');p.setAttribute('d',x[0]);hintG.appendChild(p);var L=p.getTotalLength(),a=p.getPointAtLength(0),b=p.getPointAtLength(L);hintG.removeChild(p);return {L:L,a:a,b:b};});
   function status(){msg.textContent='Nét '+(k+1)+'/'+st.length+': '+st[k][1];if(s.guide){dot.setAttribute('cx',meas[k].a.x);dot.setAttribute('cy',meas[k].a.y);dot.style.opacity=1;}else dot.style.opacity=0;}
   function addPath(g,d,color,w,anim){var p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');g.appendChild(p);
     if(anim){var L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.getBoundingClientRect();p.style.transition='stroke-dashoffset .6s ease';p.style.strokeDashoffset=0;}return p;}
   function showHint(){hintG.innerHTML='';addPath(hintG,st[k][0],'var(--accent)',7,true).style.opacity=.6;}
   function clearInk(){ctx.clearRect(0,0,cv.width,cv.height);}
   function toBox(e){var b=cv.getBoundingClientRect();return [(e.clientX-b.left)/b.width*100,(e.clientY-b.top)/b.height*100,e.clientX-b.left,e.clientY-b.top];}
   function dist(p,q){return Math.hypot(p[0]-q.x,p[1]-q.y);}
   cv.onpointerdown=function(e){if(S.done)return;down=true;cv.setPointerCapture(e.pointerId);pts=[toBox(e)];};
   cv.onpointermove=function(e){if(!down)return;var p=toBox(e),l=pts[pts.length-1];ctx.beginPath();ctx.moveTo(l[2],l[3]);ctx.lineTo(p[2],p[3]);ctx.stroke();pts.push(p);};
   cv.onpointerup=cv.onpointercancel=function(){if(!down)return;down=false;check();};
   function check(){
     var m=meas[k],first=pts[0],last=pts[pts.length-1],len=0;for(var i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
     var tol=Math.max(16,m.L*0.35);
     var ok=pts.length>1&&dist(first,m.a)<=tol&&dist(last,m.b)<=tol&&len>=m.L*0.4;
     clearInk();
     if(ok){hintG.innerHTML='';addPath(doneG,st[k][0],'var(--fg)',7,true);k++;misses=0;
       if(k>=st.length){dot.style.opacity=0;say(s.h);S.done=true;skip.hidden=true;msg.textContent='Đúng thứ tự nét!';feedback('good','Viết đúng rồi!',s.h+' · '+(TILEPY[s.h]||''));setCta('TIẾP TỤC',true,next);}
       else status();}
     else{misses++;box.classList.remove('shake');box.getBoundingClientRect();box.classList.add('shake');msg.textContent='Chưa đúng nét '+(k+1)+' ('+st[k][1]+'). '+(misses>=2?'Xem gợi ý màu hồng.':'Thử lại nhé.');if(misses>=2)showHint();}
   }
   document.getElementById('whint').onclick=showHint;
   status();setCta('VIẾT XONG ĐỂ TIẾP TỤC',false,function(){});
   skip.hidden=false;skip.onclick=function(){S.done=true;skip.hidden=true;feedback('good','Đã bỏ qua','Chép chữ '+s.h+' ra giấy 5 lần nhé.');setCta('TIẾP TỤC',true,next);};
 }
};
function finish(){
  foot.className='foot';fb.hidden=true;skip.hidden=true;
  var right=S.base-S.missed.length;
  var h='<div class="end"><div class="han">棒</div><h2>Xong '+S.name+'!</h2><p>Đúng ngay lần đầu '+Math.max(0,right)+'/'+S.base+' câu</p>';
  if(S.missed.length)h+='<div class="miss"><b>Cần ôn thêm</b><ul>'+S.missed.map(function(m){return '<li>'+m+'</li>';}).join('')+'</ul></div>';
  app.innerHTML=h+'</div>';say('棒');
  setCta('VỀ BÀI '+CUR.n,true,function(){lessonPage(CUR.n);});
}
home();
})();
</script>


<script>
(function(){
  var inst=document.getElementById('inst'),msg=document.getElementById('inst-msg'),btn=document.getElementById('inst-btn'),foot=document.getElementById('foot'),deferred=null,want=false;
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  var ua=navigator.userAgent||'',isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var dismissed=false;try{dismissed=localStorage.getItem('hanngu-inst-x')==='1';}catch(e){}
  function sync(){inst.hidden=!want||!foot.hidden;}
  if(standalone||dismissed)return;
  var SHARE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="nút Chia sẻ"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  if(isIOS){
    var safari=!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
    msg.innerHTML=(safari?'Bấm nút Chia sẻ ':'Bấm nút Chia sẻ '+SHARE+' trên thanh địa chỉ (hoặc mở bằng Safari), ')+(safari?SHARE+' ở thanh dưới, ':'')+'kéo xuống chọn <b>“Thêm vào MH chính”</b>.';
    want=true;sync();
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;btn.hidden=false;want=true;sync();});
  btn.onclick=function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;btn.hidden=true;want=false;sync();}).catch(function(){});};
  window.addEventListener('appinstalled',function(){want=false;sync();});
  document.getElementById('inst-x').onclick=function(){want=false;sync();try{localStorage.setItem('hanngu-inst-x','1');}catch(e){}};
  new MutationObserver(sync).observe(foot,{attributes:true,attributeFilter:['hidden']});
})();
</script>
